<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblical Languages</title>
<link rel="stylesheet" href="css/style.css?v=2026-10-01a">
</head>
<body>
<header>
  <h1>Biblical Languages</h1>
  <nav id="main-nav">
    <button data-view="flashcards" class="nav-btn active">Flashcards</button>
    <button data-view="grammar" class="nav-btn">Grammar</button>
    <button data-view="paradigms" class="nav-btn">Paradigms</button>
    <button data-view="reading" class="nav-btn">Reading</button>
  </nav>
</header>

<main>
  <section id="view-flashcards" class="view active">
    <div class="lang-switch">
      <button data-lang="greek" class="lang-btn active">Greek</button>
      <button data-lang="hebrew" class="lang-btn">Hebrew</button>
    </div>
    <div id="flashcard-status" class="status-line"></div>
    <div id="flashcard-area">
      <div id="card" class="card">
        <div id="card-front" class="card-face"></div>
        <div id="card-back" class="card-face hidden"></div>
      </div>
      <div id="card-controls">
        <button id="show-answer-btn">Show Answer</button>
        <div id="grade-controls" class="hidden">
          <button data-grade="again">Again</button>
          <button data-grade="hard">Hard</button>
          <button data-grade="good">Good</button>
          <button data-grade="easy">Easy</button>
        </div>
      </div>
    </div>
  </section>

  <section id="view-grammar" class="view">
    <div class="lang-switch">
      <button data-lang="greek" class="lang-btn active">Greek</button>
      <button data-lang="hebrew" class="lang-btn">Hebrew</button>
    </div>
    <div id="grammar-content" class="topic-viewer-content"></div>
    <div class="topic-controls">
      <button id="grammar-next-btn">Show Another</button>
    </div>
  </section>

  <section id="view-paradigms" class="view">
    <div class="lang-switch">
      <button data-lang="greek" class="lang-btn active">Greek</button>
      <button data-lang="hebrew" class="lang-btn">Hebrew</button>
    </div>
    <div id="paradigms-content" class="topic-viewer-content"></div>
    <div class="topic-controls">
      <button id="paradigms-next-btn">Show Another</button>
    </div>
  </section>

  <section id="view-reading" class="view">
    <div class="lang-switch">
      <button data-lang="greek" class="lang-btn active">Greek</button>
      <button data-lang="hebrew" class="lang-btn">Hebrew</button>
    </div>
    <div id="reading-status" class="status-line"></div>
    <div id="reading-passage"></div>
    <div id="reading-controls">
      <button id="mark-read-btn">Mark as Read &amp; Continue</button>
    </div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
